# Запуск тестов на каждый push и pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: End-to-end smoke test (fake models, no LaTeX)
        run: python scripts/smoke_test.py
